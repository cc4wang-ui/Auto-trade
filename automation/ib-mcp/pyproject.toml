[project]
name = "ib-mcp"
version = "0.1.0"
description = "MCP server exposing Interactive Brokers paper/live trading + market data to Claude Code"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Cross", email = "cc4wang@gmail.com" }]

dependencies = [
  "fastmcp>=0.5.0,<1.0",
  "ib_async>=1.0.3,<2.0",
  "pydantic>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "zoneinfo;python_version<'3.9'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
ib-mcp = "ib_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
